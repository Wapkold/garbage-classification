name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-сборка torch: тестам GPU не нужен, а CUDA-колёса весят гигабайты
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pillow scikit-learn pytest
      - run: python -m pytest -q
